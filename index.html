<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Video Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }

        .carousel-container {
            position: relative;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .video-comparison {
            display: none;
            align-items: flex-start;
            gap: 20px;
        }

        .video-comparison.active {
            display: flex;
        }

        .video-section {
            flex: 1;
            text-align: center;
        }

        .video-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        .model1-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .model2-label {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .no-video {
            padding: 40px;
            background: #333;
            color: #888;
            text-align: center;
            border-radius: 10px;
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .control-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .counter {
            font-size: 18px;
            color: #ccc;
        }

        .prompt-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .prompt-label {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }

        .prompt-text {
            font-size: 20px;
            color: #fff;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            background: #2a1f1f;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .video-comparison {
                flex-direction: column;
            }
            
            .container {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Model Video Comparison</h1>
        
        <div id="app">
            <div class="loading">Loading videos...</div>
        </div>
    </div>

    <script>
        class VideoCarousel {
            constructor() {
                this.videos = [];
                this.currentIndex = 0;
                this.appElement = document.getElementById('app');
                
                this.loadVideos();
            }

            async loadVideos() {
                try {
                    const response = await fetch('videos.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    this.videos = await response.json();
                    this.render();
                } catch (error) {
                    this.renderError(`Failed to load videos: ${error.message}`);
                }
            }

            render() {
                if (this.videos.length === 0) {
                    this.appElement.innerHTML = '<div class="error">No videos found</div>';
                    return;
                }

                this.appElement.innerHTML = `
                    <div class="carousel-container">
                        ${this.videos.map((videoSet, index) => this.renderVideoComparison(videoSet, index)).join('')}
                    </div>
                    
                    <div class="carousel-controls">
                        <button class="control-btn" id="prevBtn" onclick="carousel.previousVideo()">
                            ← Previous
                        </button>
                        <span class="counter">
                            ${this.currentIndex + 1} of ${this.videos.length}
                        </span>
                        <button class="control-btn" id="nextBtn" onclick="carousel.nextVideo()">
                            Next →
                        </button>
                    </div>
                    
                    <div class="prompt-section">
                        <div class="prompt-label">Prompt used for this video pair:</div>
                        <div class="prompt-text" id="currentPrompt">
                            ${this.videos[this.currentIndex].prompt}
                        </div>
                    </div>
                `;

                this.updateControls();
                this.showCurrentVideo();
            }

            renderVideoComparison(videoSet, index) {
                return `
                    <div class="video-comparison ${index === this.currentIndex ? 'active' : ''}" data-index="${index}">
                        <div class="video-section">
                            <div class="video-label model1-label">Model 1</div>
                            <div class="video-container">
                                ${videoSet.model1_path ? 
                                    `<video controls>
                                        <source src="${videoSet.model1_path}" type="video/mp4">
                                        Your browser does not support the video tag.
                                    </video>` :
                                    `<div class="no-video">No Model 1 video available</div>`
                                }
                            </div>
                        </div>
                        
                        <div class="video-section">
                            <div class="video-label model2-label">Model 2</div>
                            <div class="video-container">
                                ${videoSet.model2_path ? 
                                    `<video controls>
                                        <source src="${videoSet.model2_path}" type="video/mp4">
                                        Your browser does not support the video tag.
                                    </video>` :
                                    `<div class="no-video">No Model 2 video available</div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            }

            showCurrentVideo() {
                // Hide all video comparisons
                document.querySelectorAll('.video-comparison').forEach(comparison => {
                    comparison.classList.remove('active');
                });

                // Show current video comparison
                const currentComparison = document.querySelector(`[data-index="${this.currentIndex}"]`);
                if (currentComparison) {
                    currentComparison.classList.add('active');
                }

                // Update prompt
                const promptElement = document.getElementById('currentPrompt');
                if (promptElement) {
                    promptElement.textContent = this.videos[this.currentIndex].prompt;
                }

                // Update counter
                const counterElement = document.querySelector('.counter');
                if (counterElement) {
                    counterElement.textContent = `${this.currentIndex + 1} of ${this.videos.length}`;
                }

                this.updateControls();
            }

            updateControls() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (prevBtn) {
                    prevBtn.disabled = this.currentIndex === 0;
                }
                
                if (nextBtn) {
                    nextBtn.disabled = this.currentIndex === this.videos.length - 1;
                }
            }

            nextVideo() {
                if (this.currentIndex < this.videos.length - 1) {
                    this.currentIndex++;
                    this.showCurrentVideo();
                    this.pauseAllVideos();
                }
            }

            previousVideo() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.showCurrentVideo();
                    this.pauseAllVideos();
                }
            }

            pauseAllVideos() {
                document.querySelectorAll('video').forEach(video => {
                    video.pause();
                });
            }

            renderError(message) {
                this.appElement.innerHTML = `<div class="error">${message}</div>`;
            }
        }

        // Initialize the carousel when the page loads
        let carousel;
        document.addEventListener('DOMContentLoaded', () => {
            carousel = new VideoCarousel();
        });

        // Add keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!carousel) return;
            
            if (e.key === 'ArrowLeft') {
                carousel.previousVideo();
            } else if (e.key === 'ArrowRight') {
                carousel.nextVideo();
            }
        });
    </script>
</body>
</html>

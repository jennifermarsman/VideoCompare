<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Model Video Comparison</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #fff;
        }

        .carousel-container {
            position: relative;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .video-comparison {
            display: none;
            align-items: flex-start;
            gap: 20px;
        }

        .video-comparison.active {
            display: flex;
        }

        .video-section {
            flex: 1;
            text-align: center;
        }

        .video-label {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        .model1-label {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .model2-label {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        video {
            width: 100%;
            height: auto;
            display: block;
        }

        .no-video {
            padding: 40px;
            background: #333;
            color: #888;
            text-align: center;
            border-radius: 10px;
        }

        .carousel-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 20px 0;
        }

        .control-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .control-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .counter {
            font-size: 18px;
            color: #ccc;
        }

        .prompt-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .prompt-label {
            font-size: 16px;
            color: #888;
            margin-bottom: 10px;
        }

        .prompt-text {
            font-size: 20px;
            color: #fff;
            font-style: italic;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 40px;
            color: #ff6b6b;
            background: #2a1f1f;
            border-radius: 10px;
        }

        .add-prompt-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
        }

        .add-prompt-btn {
            background: linear-gradient(135deg, #00b09b 0%, #96c93d 100%);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .add-prompt-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 176, 155, 0.4);
        }

        .add-prompt-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .prompt-input-container {
            display: none;
            margin-top: 20px;
        }

        .prompt-input-container.active {
            display: block;
        }

        .prompt-input {
            width: 100%;
            max-width: 600px;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #444;
            border-radius: 10px;
            background: #1a1a1a;
            color: white;
            margin-bottom: 15px;
        }

        .prompt-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .prompt-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .prompt-submit-btn, .prompt-cancel-btn {
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            border: none;
            transition: all 0.3s ease;
        }

        .prompt-submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .prompt-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .prompt-submit-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .prompt-cancel-btn {
            background: #555;
            color: white;
        }

        .prompt-cancel-btn:hover {
            background: #666;
        }

        .status-message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }

        .status-message.active {
            display: block;
        }

        .status-message.info {
            background: #1e3a5f;
            color: #6db3f2;
        }

        .status-message.success {
            background: #1e4620;
            color: #6bcf73;
        }

        .status-message.error {
            background: #4a1f1f;
            color: #ff6b6b;
        }

        @media (max-width: 768px) {
            .video-comparison {
                flex-direction: column;
            }
            
            .container {
                padding: 10px;
            }

            .prompt-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Model Video Comparison</h1>
        
        <div id="app">
            <div class="loading">Loading videos...</div>
        </div>

        <div class="add-prompt-section">
            <button class="add-prompt-btn" onclick="carousel.togglePromptInput()">➕ Add New Prompt</button>
            
            <div class="prompt-input-container" id="promptInputContainer">
                <input 
                    type="text" 
                    class="prompt-input" 
                    id="promptInput" 
                    placeholder="Enter your prompt here (e.g., 'A cat playing piano')..."
                    maxlength="500"
                />
                <div class="prompt-actions">
                    <button class="prompt-submit-btn" id="submitPromptBtn" onclick="carousel.submitPrompt()">
                        Generate Videos
                    </button>
                    <button class="prompt-cancel-btn" onclick="carousel.togglePromptInput()">
                        Cancel
                    </button>
                </div>
                <div class="status-message" id="statusMessage"></div>
            </div>
        </div>
    </div>

    <script>
        class VideoCarousel {
            constructor() {
                this.videos = [];
                this.currentIndex = 0;
                this.appElement = document.getElementById('app');
                
                this.loadVideos();
            }

            async loadVideos() {
                try {
                    const response = await fetch('videos.json');
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    this.videos = await response.json();
                    this.render();
                } catch (error) {
                    this.renderError(`Failed to load videos: ${error.message}`);
                }
            }

            togglePromptInput() {
                const container = document.getElementById('promptInputContainer');
                const input = document.getElementById('promptInput');
                container.classList.toggle('active');
                
                if (container.classList.contains('active')) {
                    input.focus();
                    this.hideStatusMessage();
                } else {
                    input.value = '';
                    this.hideStatusMessage();
                }
            }

            async submitPrompt() {
                const input = document.getElementById('promptInput');
                const submitBtn = document.getElementById('submitPromptBtn');
                const prompt = input.value.trim();

                if (!prompt) {
                    this.showStatusMessage('Please enter a prompt', 'error');
                    return;
                }

                // Disable submit button and show loading state
                submitBtn.disabled = true;
                this.showStatusMessage('Generating videos... This may take a few minutes.', 'info');

                try {
                    const response = await fetch('/api/generate-videos', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ prompt: prompt })
                    });

                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(errorText || `HTTP error! status: ${response.status}`);
                    }

                    const result = await response.json();
                    
                    if (result.success) {
                        // Add new video pair to the list
                        this.videos.push({
                            model1_path: result.model1_path,
                            model2_path: result.model2_path,
                            prompt: result.prompt
                        });

                        // Navigate to the new video
                        this.currentIndex = this.videos.length - 1;
                        this.render();

                        // Show success message
                        this.showStatusMessage(`✅ Videos generated successfully! The new video pair has been added to the carousel.`, 'success');
                        
                        // Reset form and close after a delay
                        setTimeout(() => {
                            input.value = '';
                            this.togglePromptInput();
                        }, 3000);
                    } else {
                        throw new Error('Video generation failed');
                    }
                } catch (error) {
                    console.error('Error generating videos:', error);
                    this.showStatusMessage(`❌ Error: ${error.message}`, 'error');
                } finally {
                    submitBtn.disabled = false;
                }
            }

            showStatusMessage(message, type) {
                const statusMsg = document.getElementById('statusMessage');
                statusMsg.textContent = message;
                statusMsg.className = `status-message active ${type}`;
            }

            hideStatusMessage() {
                const statusMsg = document.getElementById('statusMessage');
                statusMsg.className = 'status-message';
            }

            render() {
                if (this.videos.length === 0) {
                    this.appElement.innerHTML = '<div class="error">No videos found</div>';
                    return;
                }

                this.appElement.innerHTML = `
                    <div class="carousel-container">
                        ${this.videos.map((videoSet, index) => this.renderVideoComparison(videoSet, index)).join('')}
                    </div>
                    
                    <div class="carousel-controls">
                        <button class="control-btn" id="prevBtn" onclick="carousel.previousVideo()">
                            ← Previous
                        </button>
                        <span class="counter">
                            ${this.currentIndex + 1} of ${this.videos.length}
                        </span>
                        <button class="control-btn" id="nextBtn" onclick="carousel.nextVideo()">
                            Next →
                        </button>
                    </div>
                    
                    <div class="prompt-section">
                        <div class="prompt-label">Prompt used for this video pair:</div>
                        <div class="prompt-text" id="currentPrompt">
                            ${this.videos[this.currentIndex].prompt}
                        </div>
                    </div>
                `;

                this.updateControls();
                this.showCurrentVideo();
            }

            renderVideoComparison(videoSet, index) {
                return `
                    <div class="video-comparison ${index === this.currentIndex ? 'active' : ''}" data-index="${index}">
                        <div class="video-section">
                            <div class="video-label model1-label">Model 1</div>
                            <div class="video-container">
                                ${videoSet.model1_path ? 
                                    `<video controls>
                                        <source src="${videoSet.model1_path}" type="video/mp4">
                                        Your browser does not support the video tag.
                                    </video>` :
                                    `<div class="no-video">No Model 1 video available</div>`
                                }
                            </div>
                        </div>
                        
                        <div class="video-section">
                            <div class="video-label model2-label">Model 2</div>
                            <div class="video-container">
                                ${videoSet.model2_path ? 
                                    `<video controls>
                                        <source src="${videoSet.model2_path}" type="video/mp4">
                                        Your browser does not support the video tag.
                                    </video>` :
                                    `<div class="no-video">No Model 2 video available</div>`
                                }
                            </div>
                        </div>
                    </div>
                `;
            }

            showCurrentVideo() {
                // Hide all video comparisons
                document.querySelectorAll('.video-comparison').forEach(comparison => {
                    comparison.classList.remove('active');
                });

                // Show current video comparison
                const currentComparison = document.querySelector(`[data-index="${this.currentIndex}"]`);
                if (currentComparison) {
                    currentComparison.classList.add('active');
                }

                // Update prompt
                const promptElement = document.getElementById('currentPrompt');
                if (promptElement) {
                    promptElement.textContent = this.videos[this.currentIndex].prompt;
                }

                // Update counter
                const counterElement = document.querySelector('.counter');
                if (counterElement) {
                    counterElement.textContent = `${this.currentIndex + 1} of ${this.videos.length}`;
                }

                this.updateControls();
            }

            updateControls() {
                const prevBtn = document.getElementById('prevBtn');
                const nextBtn = document.getElementById('nextBtn');
                
                if (prevBtn) {
                    prevBtn.disabled = this.currentIndex === 0;
                }
                
                if (nextBtn) {
                    nextBtn.disabled = this.currentIndex === this.videos.length - 1;
                }
            }

            nextVideo() {
                if (this.currentIndex < this.videos.length - 1) {
                    this.currentIndex++;
                    this.showCurrentVideo();
                    this.pauseAllVideos();
                }
            }

            previousVideo() {
                if (this.currentIndex > 0) {
                    this.currentIndex--;
                    this.showCurrentVideo();
                    this.pauseAllVideos();
                }
            }

            pauseAllVideos() {
                document.querySelectorAll('video').forEach(video => {
                    video.pause();
                });
            }

            renderError(message) {
                this.appElement.innerHTML = `<div class="error">${message}</div>`;
            }
        }

        // Initialize the carousel when the page loads
        let carousel;
        document.addEventListener('DOMContentLoaded', () => {
            carousel = new VideoCarousel();
        });

        // Add keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (!carousel) return;
            
            if (e.key === 'ArrowLeft') {
                carousel.previousVideo();
            } else if (e.key === 'ArrowRight') {
                carousel.nextVideo();
            }
        });
    </script>
</body>
</html>
